<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="54" viewBox="0 0 2200 54" fill="none">
  <defs>
    <linearGradient id="base" x1="120" y1="27" x2="2080" y2="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset=".18" stop-color="#38BDF8" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#818CF8" stop-opacity=".95"/>
      <stop offset=".82" stop-color="#22C55E" stop-opacity=".65"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E0F7FF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="120" y="26" width="1960" height="2" rx="1" fill="url(#base)"/>
  <g filter="url(#glow)">
    <rect x="-280" y="24" width="280" height="6" rx="3" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2480 0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(1100 27)">
    <rect x="-12" y="-12" width="24" height="24" rx="7" transform="rotate(45)" fill="#DDF5FF" fill-opacity=".16" stroke="#86D9FF" stroke-opacity=".8"/>
    <circle r="2.4" fill="#FFFFFF" fill-opacity=".95">
      <animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>